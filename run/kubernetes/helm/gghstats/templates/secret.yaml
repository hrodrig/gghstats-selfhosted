{{- if and (not .Values.githubToken.existingSecret) .Values.githubToken.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.githubToken.secretName }}
type: Opaque
stringData:
  {{ .Values.githubToken.secretKey }}: {{ .Values.githubToken.value | quote }}
{{- end }}
---
{{- if and (not .Values.apiToken.existingSecret) .Values.apiToken.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apiToken.secretName }}
type: Opaque
stringData:
  {{ .Values.apiToken.secretKey }}: {{ .Values.apiToken.value | quote }}
{{- end }}
